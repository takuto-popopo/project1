<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>視覚探索実験（クリック計測）</title>
<style>
  :root { --bg: #7f7f7f; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", "Meiryo", sans-serif;
    background: var(--bg);
    color: #222;
  }
  .screen { display: none; height: 100%; }
  .screen.active { display: flex; flex-direction: column; }

  /* ---- 設定画面 ---- */
  #screen-setup { align-items: center; justify-content: center; }
  .panel {
    background: #f4f4f2; border-radius: 14px; padding: 34px 44px;
    max-width: 640px; width: 92%; box-shadow: 0 6px 24px rgba(0,0,0,.25);
  }
  .panel h1 { font-size: 22px; margin: 0 0 6px; }
  .panel .sub { color: #555; font-size: 13px; margin-bottom: 18px; }
  .panel label { display: block; font-size: 14px; margin: 14px 0 4px; font-weight: 600; }
  .panel input[type=text] {
    width: 100%; padding: 10px 12px; font-size: 15px; border: 1px solid #bbb; border-radius: 8px;
  }
  .panel .info { font-size: 13px; color: #444; background: #e8eef7; border-radius: 8px; padding: 10px 14px; margin-top: 16px; line-height: 1.7; }
  .btn {
    display: inline-block; margin-top: 20px; padding: 12px 34px; font-size: 16px;
    background: #2a5aa8; color: #fff; border: none; border-radius: 9px; cursor: pointer;
  }
  .btn:hover { background: #1d4686; }
  .btn.gray { background: #666; }
  .btn.gray:hover { background: #444; }

  /* ---- 実行画面 ---- */
  #screen-run { align-items: center; justify-content: center; position: relative; }
  #stage { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; }
  #fixation {
    font-size: 90px; color: #111; user-select: none; line-height: 1;
  }
  #imgwrap { display: none; cursor: crosshair; }
  #stim { display: block; user-select: none; -webkit-user-drag: none; }
  #blank { display: none; width: 40px; height: 40px; }
  #hud {
    position: fixed; top: 10px; right: 14px; text-align: right; z-index: 10;
  }
  #progress { color: #eee; font-size: 14px; margin-bottom: 6px; }
  #btnAbort { padding: 6px 14px; font-size: 12px; border-radius: 6px; border: 1px solid #999;
    background: rgba(255,255,255,.85); color: #333; cursor: pointer; }

  /* ---- 結果画面 ---- */
  #screen-done { align-items: center; justify-content: center; overflow: auto; }
  #summaryBox { display: flex; gap: 14px; margin: 16px 0; flex-wrap: wrap; }
  .stat { background: #fff; border-radius: 10px; padding: 14px 22px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,.12); }
  .stat .num { font-size: 26px; font-weight: 700; color: #2a5aa8; }
  .stat .lbl { font-size: 12px; color: #666; }
  #condTableWrap, #resultTableWrap { background: #fff; border-radius: 10px; padding: 12px 16px; max-width: 900px; width: 92%; margin-bottom: 14px; overflow: auto; }
  h2 { font-size: 16px; margin: 6px 0 10px; }
  table { border-collapse: collapse; font-size: 13px; width: 100%; }
  th, td { border: 1px solid #ccc; padding: 5px 9px; text-align: center; }
  th { background: #eef2f8; }
  #resultTableWrap { max-height: 260px; }
  #toast {
    display: none; position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%);
    background: #222; color: #fff; padding: 10px 20px; border-radius: 8px; font-size: 14px; z-index: 99;
  }
</style>
</head>
<body>

<!-- ============ 設定画面 ============ -->
<div id="screen-setup" class="screen active">
  <div class="panel">
    <h1>視覚探索実験</h1>
    <div class="sub">画像の中からターゲットを見つけて、できるだけ早くクリックしてください。</div>

    <label>被験者ID（氏名・学籍番号など）</label>
    <input type="text" id="pid" placeholder="例: s24xxxx / test01">

    <label>ターゲットの説明（被験者に見せる指示文）</label>
    <input type="text" id="tlabel" value="金色の星">

    <div class="info">
      試行数: <b id="nTrials">-</b>　|　各試行: 注視点(600ms) → 画像表示 → クリック<br>
      クリックした瞬間に次の試行へ進みます（1試行1クリック）。<br>
      <b>Escキー</b>または右上のボタンでいつでも中断し、ここまでの結果を保存できます。
    </div>
    <button class="btn" id="btnStart">実験開始</button>
  </div>
</div>

<!-- ============ 実行画面 ============ -->
<div id="screen-run" class="screen">
  <div id="hud">
    <div id="progress"></div>
    <button id="btnAbort">中止して結果を保存</button>
  </div>
  <div id="stage">
    <div id="fixation">＋</div>
    <div id="imgwrap"><img id="stim" alt=""></div>
    <div id="blank"></div>
  </div>
</div>

<!-- ============ 結果画面 ============ -->
<div id="screen-done" class="screen">
  <div class="panel" style="max-width:940px; width:94%;">
    <h1>実験終了</h1>
    <div id="summaryBox"></div>
    <div id="condTableWrap">
      <h2>条件別の平均反応時間（dv=明度差, ds=彩度差 [%]）</h2>
      <div id="condTable"></div>
    </div>
    <div id="resultTableWrap">
      <h2>試行ごとの結果</h2>
      <div id="resultTable"></div>
    </div>
    <button class="btn" id="btnDownload">結果CSVをダウンロード</button>
    <button class="btn gray" id="btnCopy">クリップボードにコピー</button>
    <button class="btn gray" id="btnReload">画面を閉じる / 最初から</button>
  </div>
</div>

<div id="toast"></div>

<script>
"use strict";
const MANIFEST = {"canvas": {"w": 1920, "h": 1080}, "seed": 42, "meta": {"target_label": "金色の星", "dv_levels": [0, 15, 30], "ds_levels": [0, 15, 30], "layout": "random", "n": 27, "generated_at": "2026-11-12T13:34:59"}, "trials": [{"file": "images/trial_0001.png", "tx": 0.07483, "ty": 0.54549, "bx0": 0.04696, "by0": 0.49596, "bx1": 0.10269, "by1": 0.59503, "dv": 15, "ds": 0, "dcount": 4, "layout": "random"}, {"file": "images/trial_0002.png", "tx": 0.17233, "ty": 0.50832, "bx0": 0.11817, "by0": 0.41202, "bx1": 0.2265, "by1": 0.60462, "dv": 30, "ds": 0, "dcount": 6, "layout": "random"}, {"file": "images/trial_0003.png", "tx": 0.5309, "ty": 0.39284, "bx0": 0.48949, "by0": 0.31923, "bx1": 0.5723, "by1": 0.46645, "dv": 30, "ds": 15, "dcount": 9, "layout": "random"}, {"file": "images/trial_0004.png", "tx": 0.21702, "ty": 0.39163, "bx0": 0.18264, "by0": 0.33052, "bx1": 0.25139, "by1": 0.45274, "dv": 15, "ds": 15, "dcount": 6, "layout": "random"}, {"file": "images/trial_0005.png", "tx": 0.84866, "ty": 0.61388, "bx0": 0.82184, "by0": 0.5662, "bx1": 0.87549, "by1": 0.66157, "dv": 30, "ds": 30, "dcount": 9, "layout": "random"}, {"file": "images/trial_0006.png", "tx": 0.21427, "ty": 0.84857, "bx0": 0.17, "by0": 0.76987, "bx1": 0.25854, "by1": 0.92727, "dv": 0, "ds": 30, "dcount": 6, "layout": "random"}, {"file": "images/trial_0007.png", "tx": 0.36782, "ty": 0.70284, "bx0": 0.3173, "by0": 0.61303, "bx1": 0.41834, "by1": 0.79266, "dv": 15, "ds": 30, "dcount": 7, "layout": "random"}, {"file": "images/trial_0008.png", "tx": 0.91443, "ty": 0.18648, "bx0": 0.88266, "by0": 0.13, "bx1": 0.9462, "by1": 0.24297, "dv": 0, "ds": 0, "dcount": 7, "layout": "random"}, {"file": "images/trial_0009.png", "tx": 0.13709, "ty": 0.37383, "bx0": 0.11209, "by0": 0.32938, "bx1": 0.16209, "by1": 0.41827, "dv": 0, "ds": 15, "dcount": 8, "layout": "random"}, {"file": "images/trial_0010.png", "tx": 0.33099, "ty": 0.42848, "bx0": 0.30052, "by0": 0.37431, "bx1": 0.36146, "by1": 0.48264, "dv": 30, "ds": 15, "dcount": 5, "layout": "random"}, {"file": "images/trial_0011.png", "tx": 0.47843, "ty": 0.19415, "bx0": 0.44431, "by0": 0.1335, "bx1": 0.51254, "by1": 0.2548, "dv": 0, "ds": 30, "dcount": 7, "layout": "random"}, {"file": "images/trial_0012.png", "tx": 0.5041, "ty": 0.74893, "bx0": 0.46451, "by0": 0.67856, "bx1": 0.54368, "by1": 0.8193, "dv": 15, "ds": 30, "dcount": 10, "layout": "random"}, {"file": "images/trial_0013.png", "tx": 0.76499, "ty": 0.6779, "bx0": 0.73999, "by0": 0.63345, "bx1": 0.78999, "by1": 0.72234, "dv": 30, "ds": 0, "dcount": 10, "layout": "random"}, {"file": "images/trial_0014.png", "tx": 0.80022, "ty": 0.14825, "bx0": 0.75543, "by0": 0.06862, "bx1": 0.84502, "by1": 0.22788, "dv": 0, "ds": 0, "dcount": 10, "layout": "random"}, {"file": "images/trial_0015.png", "tx": 0.13504, "ty": 0.7774, "bx0": 0.09494, "by0": 0.70611, "bx1": 0.17515, "by1": 0.8487, "dv": 15, "ds": 0, "dcount": 10, "layout": "random"}, {"file": "images/trial_0016.png", "tx": 0.06693, "ty": 0.47895, "bx0": 0.03907, "by0": 0.42941, "bx1": 0.0948, "by1": 0.52849, "dv": 15, "ds": 15, "dcount": 5, "layout": "random"}, {"file": "images/trial_0017.png", "tx": 0.89133, "ty": 0.76162, "bx0": 0.85279, "by0": 0.6931, "bx1": 0.92987, "by1": 0.83013, "dv": 0, "ds": 15, "dcount": 6, "layout": "random"}, {"file": "images/trial_0018.png", "tx": 0.23766, "ty": 0.85948, "bx0": 0.2025, "by0": 0.79698, "bx1": 0.27281, "by1": 0.92198, "dv": 30, "ds": 30, "dcount": 5, "layout": "random"}, {"file": "images/trial_0019.png", "tx": 0.4318, "ty": 0.24297, "bx0": 0.39117, "by0": 0.17074, "bx1": 0.47242, "by1": 0.31519, "dv": 0, "ds": 30, "dcount": 9, "layout": "random"}, {"file": "images/trial_0020.png", "tx": 0.45608, "ty": 0.18238, "bx0": 0.41233, "by0": 0.1046, "bx1": 0.49983, "by1": 0.26016, "dv": 15, "ds": 30, "dcount": 7, "layout": "random"}, {"file": "images/trial_0021.png", "tx": 0.11507, "ty": 0.36302, "bx0": 0.08408, "by0": 0.30793, "bx1": 0.14606, "by1": 0.41811, "dv": 30, "ds": 15, "dcount": 10, "layout": "random"}, {"file": "images/trial_0022.png", "tx": 0.58994, "ty": 0.41372, "bx0": 0.53942, "by0": 0.3239, "bx1": 0.64046, "by1": 0.50353, "dv": 30, "ds": 30, "dcount": 9, "layout": "random"}, {"file": "images/trial_0023.png", "tx": 0.81927, "ty": 0.76539, "bx0": 0.78619, "by0": 0.7066, "bx1": 0.85234, "by1": 0.82419, "dv": 30, "ds": 0, "dcount": 5, "layout": "random"}, {"file": "images/trial_0024.png", "tx": 0.7457, "ty": 0.34058, "bx0": 0.69935, "by0": 0.25817, "bx1": 0.79206, "by1": 0.42299, "dv": 0, "ds": 15, "dcount": 4, "layout": "random"}, {"file": "images/trial_0025.png", "tx": 0.54791, "ty": 0.18445, "bx0": 0.49895, "by0": 0.09741, "bx1": 0.59687, "by1": 0.27149, "dv": 15, "ds": 15, "dcount": 7, "layout": "random"}, {"file": "images/trial_0026.png", "tx": 0.3555, "ty": 0.69341, "bx0": 0.31566, "by0": 0.62257, "bx1": 0.39535, "by1": 0.76424, "dv": 0, "ds": 0, "dcount": 4, "layout": "random"}, {"file": "images/trial_0027.png", "tx": 0.38082, "ty": 0.3794, "bx0": 0.35399, "by0": 0.33171, "bx1": 0.40764, "by1": 0.42708, "dv": 15, "ds": 0, "dcount": 7, "layout": "random"}]};
const TRIALS = MANIFEST.trials;
const CANVAS_W = MANIFEST.canvas.w, CANVAS_H = MANIFEST.canvas.h;
const FIXATION_MS = 600, BLANK_MS = 350;

const $ = id => document.getElementById(id);
const screens = ["screen-setup", "screen-run", "screen-done"];
function showScreen(name) {
  screens.forEach(s => $(s).classList.toggle("active", s === name));
}
function toast(msg) {
  const t = $("toast");
  t.textContent = msg; t.style.display = "block";
  setTimeout(() => { t.style.display = "none"; }, 2200);
}

// ---- 乱数（被験者ごとに提示順をシャッフル） ----
function mulberry32(a) {
  return function() {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function strHash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }

// ---- 状態 ----
let order = [];
let pos = -1;
let results = [];
let pid = "", tlabel = "", sessionId = "";
let trialStart = 0, awaitingClick = false, timer = null, running = false;

$("nTrials").textContent = TRIALS.length;

// ---- 開始 ----
$("btnStart").addEventListener("click", () => {
  pid = $("pid").value.trim() || "no_id";
  tlabel = $("tlabel").value.trim() || "ターゲット";
  sessionId = new Date().toISOString().replace(/[-:T]/g, "").slice(0, 14);
  const rnd = mulberry32(strHash(pid + sessionId));
  order = TRIALS.map((_, i) => i);
  for (let i = order.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  results = []; pos = -1; running = true;
  showScreen("screen-run");
  nextTrial();
});

$("btnAbort").addEventListener("click", finish);
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && running) finish();
});

// ---- 試行進行 ----
function nextTrial() {
  pos++;
  if (pos >= order.length) { finish(); return; }
  const t = TRIALS[order[pos]];
  $("progress").textContent = `試行 ${pos + 1} / ${order.length}`;
  $("fixation").style.display = "block";
  $("imgwrap").style.display = "none";
  $("blank").style.display = "none";
  timer = setTimeout(showStimulus, FIXATION_MS);
}

function showStimulus() {
  const t = TRIALS[order[pos]];
  const img = $("stim");
  $("fixation").style.display = "none";
  $("blank").style.display = "none";
  const maxW = window.innerWidth * 0.92;
  const maxH = window.innerHeight * 0.84;
  const sc = Math.min(maxW / CANVAS_W, maxH / CANVAS_H);
  img.style.width = Math.round(CANVAS_W * sc) + "px";
  img.style.height = Math.round(CANVAS_H * sc) + "px";
  img.onload = () => {
    $("imgwrap").style.display = "block";
    trialStart = performance.now();
    awaitingClick = true;
  };
  img.src = t.file;
}

$("imgwrap").addEventListener("click", e => {
  if (!awaitingClick) return;
  awaitingClick = false;
  const rt = Math.round(performance.now() - trialStart);
  const img = $("stim");
  const r = img.getBoundingClientRect();
  const xn = (e.clientX - r.left) / r.width;
  const yn = (e.clientY - r.top) / r.height;
  const t = TRIALS[order[pos]];
  const hit = (xn >= t.bx0 && xn <= t.bx1 && yn >= t.by0 && yn <= t.by1) ? 1 : 0;
  const dist = Math.sqrt(Math.pow(xn - t.tx, 2) + Math.pow(yn - t.ty, 2));
  results.push({
    participant_id: pid, session_id: sessionId, order: pos + 1,
    file: t.file, dv: t.dv, ds: t.ds, dcount: t.dcount, layout: t.layout,
    rt_ms: rt, click_xn: xn.toFixed(4), click_yn: yn.toFixed(4),
    hit: hit, dist_norm: dist.toFixed(4),
    datetime: new Date().toISOString(),
  });
  $("imgwrap").style.display = "none";
  $("blank").style.display = "block";
  timer = setTimeout(nextTrial, BLANK_MS);
});

// ---- 結果 ----
function finish() {
  if (!running && pos < 0) return;
  running = false;
  clearTimeout(timer);
  awaitingClick = false;
  buildSummary();
  buildCondTable();
  buildResultTable();
  showScreen("screen-done");
}

function buildSummary() {
  const n = results.length;
  const rts = results.map(r => r.rt_ms);
  const mean = n ? Math.round(rts.reduce((a, b) => a + b, 0) / n) : 0;
  const hits = results.filter(r => r.hit === 1).length;
  $("summaryBox").innerHTML = `
    <div class="stat"><div class="num">${n}</div><div class="lbl">完了試行</div></div>
    <div class="stat"><div class="num">${mean} ms</div><div class="lbl">平均反応時間</div></div>
    <div class="stat"><div class="num">${n ? Math.round(hits / n * 100) : 0} %</div><div class="lbl">的中率</div></div>`;
}

function buildCondTable() {
  const groups = {};
  results.forEach(r => {
    const k = r.dv + "_" + r.ds;
    (groups[k] = groups[k] || []).push(r.rt_ms);
  });
  const keys = Object.keys(groups).sort((a, b) => {
    const [dva, dsa] = a.split("_").map(Number), [dvb, dsb] = b.split("_").map(Number);
    return dva - dvb || dsa - dsb;
  });
  let html = "<table><tr><th>dv (明度差%)</th><th>ds (彩度差%)</th><th>n</th><th>平均RT (ms)</th><th>SD</th></tr>";
  keys.forEach(k => {
    const [dv, ds] = k.split("_");
    const arr = groups[k];
    const m = arr.reduce((x, y) => x + y, 0) / arr.length;
    const sd = Math.sqrt(arr.reduce((x, y) => x + (y - m) ** 2, 0) / arr.length);
    html += `<tr><td>${dv}</td><td>${ds}</td><td>${arr.length}</td><td>${Math.round(m)}</td><td>${Math.round(sd)}</td></tr>`;
  });
  html += "</table>";
  $("condTable").innerHTML = html;
}

function buildResultTable() {
  let html = "<table><tr><th>#</th><th>画像</th><th>dv</th><th>ds</th><th>RT(ms)</th><th>的中</th><th>距離</th></tr>";
  results.forEach(r => {
    html += `<tr><td>${r.order}</td><td style="text-align:left">${r.file}</td><td>${r.dv}</td><td>${r.ds}</td><td>${r.rt_ms}</td><td>${r.hit ? "○" : "×"}</td><td>${r.dist_norm}</td></tr>`;
  });
  html += "</table>";
  $("resultTable").innerHTML = html;
}

function buildCsv() {
  if (!results.length) return "";
  const head = Object.keys(results[0]).join(",");
  const lines = results.map(r => Object.values(r).join(","));
  return "\uFEFF" + head + "\n" + lines.join("\n");
}
window.buildCsv = buildCsv; // 自動テスト用

$("btnDownload").addEventListener("click", () => {
  const csv = buildCsv();
  if (!csv) { toast("結果がありません"); return; }
  const blob = new Blob([csv], { type: "text/csv" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `results_${pid}_${sessionId}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
  toast("CSVを保存しました");
});

$("btnCopy").addEventListener("click", async () => {
  const csv = buildCsv();
  if (!csv) { toast("結果がありません"); return; }
  try { await navigator.clipboard.writeText(csv); toast("クリップボードにコピーしました"); }
  catch (e) { toast("コピーに失敗しました（CSVダウンロードをご利用ください）"); }
});

$("btnReload").addEventListener("click", () => location.reload());
</script>
</body>
</html>
